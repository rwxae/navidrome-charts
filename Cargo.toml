[package]
name = "navidrome-charts"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
md5 = "0.8.1"
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["blocking", "query", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
